name: CI

on:
  pull_request:
    paths-ignore: ['**/*.md', LICENSE, .gitignore]
  push:
    branches: [main]
    paths-ignore: ['**/*.md', LICENSE, .gitignore]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/build.yml
    with:
      all-platforms: ${{ github.event_name == 'workflow_dispatch' }}
